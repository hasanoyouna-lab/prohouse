<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Pro House — استلام وإرجاع الأصناف</title>
<meta name="theme-color" content="#F7DC4E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="loginView" class="login-view hidden">
  <div class="login-card">
    <img class="login-logo" src="assets/logo.png" alt="Pro House">
    <h1>Pro House</h1>
    <div class="login-sub">أدخل رقمك السري لتسجيل الدخول</div>
    <input type="tel" inputmode="numeric" pattern="[0-9]*" id="loginPinInput" class="login-pin-input" placeholder="••••" maxlength="8" autocomplete="off">
    <button class="btn gold login-btn" id="loginSubmitBtn">دخول</button>
    <div class="login-error hidden" id="loginError"></div>
  </div>
</div>

<header>
  <div class="header-top">
    <img id="headerLogoImg" class="logo" src="assets/logo.png" alt="Pro House">
    <div id="headerLogoText" class="logo-text hidden">PRO<span>HOUSE</span></div>
    <div class="title-block">
      <h1 class="brand-name">Pro House</h1>
      <div class="sub">إدارة طلبيات برو هاوس</div>
    </div>
    <button class="sync-badge" id="syncBadge" title="حالة المزامنة">🔄 متصل</button>
  </div>

  <div class="user-bar hidden" id="userBar">
    <span id="userBarName"></span>
    <span class="badge neutral" id="userBarRole"></span>
    <button class="logout-btn" id="changePinBtn">🔑 غيّر رقمي</button>
    <button class="logout-btn" id="logoutBtn">خروج</button>
  </div>

  <div class="pin-dialog hidden" id="pinDialog">
    <div class="pin-dialog-card">
      <h3>تغيير الرقم السري</h3>
      <div class="field">
        <label>رقمك الحالي</label>
        <input type="password" inputmode="numeric" id="pinCurrent" autocomplete="off" maxlength="8">
      </div>
      <div class="field">
        <label>الرقم الجديد (من ٤ لـ ٨ أرقام)</label>
        <input type="password" inputmode="numeric" id="pinNew" autocomplete="off" maxlength="8">
      </div>
      <div class="field">
        <label>أعد كتابة الرقم الجديد</label>
        <input type="password" inputmode="numeric" id="pinConfirm" autocomplete="off" maxlength="8">
      </div>
      <div class="login-error hidden" id="pinError"></div>
      <div class="toolbar" style="margin-bottom:0;">
        <button class="btn gold" id="pinSaveBtn">حفظ</button>
        <button class="btn" id="pinCancelBtn">إلغاء</button>
      </div>
      <div class="pin-note">بعد الحفظ رح تحتاج تسجّل دخول بالرقم الجديد.</div>
    </div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="dashboard">🏠 الرئيسية</button>
    <button class="tab-btn" data-tab="entry">📝 طلبية اليوم</button>
    <button class="tab-btn" data-tab="tomorrow">📦 طلبية الغد</button>
    <button class="tab-btn" data-tab="juices">🥤 جرد العصيرات</button>
    <button class="tab-btn" data-tab="report">📊 التقارير</button>
    <button class="tab-btn" data-tab="items">🍽 إدارة الأصناف</button>
    <button class="tab-btn" data-tab="settings">⚙ الإعدادات</button>
  </div>

  <div class="datebar hidden" id="entryDateBar">
    <input type="date" id="dateInput">
  </div>
  <div class="datebar hidden" id="tomorrowDateBar">
    <input type="date" id="tomorrowDateInput">
  </div>
  <div class="datebar hidden" id="juiceDateBar">
    <input type="date" id="juiceDateInput">
  </div>
</header>

<main>
  <div id="offlineBanner" class="offline-banner hidden">غير متصل بالإنترنت — بتشتغل ببيانات محفوظة محلياً وبتتزامن لما يرجع النت</div>

  <div id="dashboardView" class="view"></div>

  <div id="entryView" class="view hidden"></div>

  <div id="tomorrowView" class="view hidden"></div>

  <div id="juicesView" class="view hidden"></div>

  <div id="reportContainer" class="view hidden">
    <div class="toolbar">
      <select id="reportType">
        <option value="entries">تقرير الاستلام/الإرجاع</option>
        <option value="tomorrow">طلبية الغد (للشيف)</option>
      </select>
    </div>

    <div id="entriesReportControls">
      <div class="toolbar">
        <select id="reportMode">
          <option value="day">يوم</option>
          <option value="month" selected>شهر</option>
          <option value="range">فترة</option>
        </select>
        <input type="date" id="reportDayInput" class="hidden">
        <input type="month" id="reportMonthInput">
        <input type="date" id="reportStartInput" class="hidden">
        <span class="hidden" id="reportRangeSep">←</span>
        <input type="date" id="reportEndInput" class="hidden">
        <button class="btn primary" id="reportGoBtn">عرض</button>
        <button class="btn gold" id="exportExcelBtn">⬇ تصدير Excel</button>
      </div>
      <div class="toolbar">
        <select id="reportBranchFilter"><option value="">كل الفروع</option></select>
        <select id="reportCategoryFilter"><option value="">كل التصنيفات</option></select>
        <select id="reportEmployeeFilter"><option value="">كل الموظفين</option></select>
        <label style="display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;cursor:pointer;">
          <input type="checkbox" id="reportFlaggedOnly" style="width:auto;">
          الأصناف المرتفعة الإرجاع بس
        </label>
      </div>
      <div id="reportView"></div>
    </div>

    <div id="tomorrowReportControls" class="hidden">
      <div class="toolbar">
        <input type="date" id="tomorrowReportDate">
        <select id="tomorrowReportBranch"><option value="">كل الفروع</option></select>
        <button class="btn primary" id="tomorrowReportGoBtn">عرض</button>
        <button class="btn gold" id="tomorrowReportExportBtn">⬇ تصدير Excel</button>
      </div>
      <div id="tomorrowReportView"></div>
    </div>
  </div>

  <div id="itemsView" class="view hidden"></div>

  <div id="settingsView" class="view hidden"></div>
</main>

<div class="save-bar hidden" id="saveBarEntry">
  <div class="save-status" id="saveStatus">لسا ما تحفظ شي لهذا اليوم</div>
  <button class="save-btn" id="saveBtn">💾 حفظ اليوم</button>
</div>

<div class="save-bar hidden" id="saveBarTomorrow">
  <div class="save-status" id="tomorrowStatus">لسا ما تحفظ شي</div>
  <button class="save-btn" id="tomorrowSaveBtn">💾 حفظ الطلبية</button>
</div>

<div class="save-bar hidden" id="saveBarJuices">
  <div class="save-status" id="juiceStatus">لسا ما تحفظ جرد لهذا اليوم</div>
  <button class="save-btn" id="juiceSaveBtn">💾 حفظ الجرد</button>
</div>

<div class="toast" id="toast"></div>

<!-- ExcelJS و Chart.js ما بينحمّلوا مع الإقلاع — بينجلبوا بس أول ما تُفتح شاشة التقارير
     (شوف loadReportLibs بـ js/report.js). حجمهم مع بعض أكبر من التطبيق كله، وأغلب الموظفين
     ما بيفتحوا التقارير أصلاً؛ تحميلهم بالبداية كان بيبطّئ الفتح على جوالات النت الضعيف. -->
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/sync.js"></script>
<script src="js/entry.js"></script>
<script src="js/items.js"></script>
<script src="js/tomorrow.js"></script>
<script src="js/juices.js"></script>
<script src="js/report.js"></script>
<script src="js/settings.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/main.js"></script>

</body>
</html>
